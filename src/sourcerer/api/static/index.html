<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sourcerer</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #272b35;
      --text: #e6e8ee; --muted: #9aa3b2; --accent: #7c9cff; --accent-2: #5a7bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 760px; padding: 48px 20px 80px; }
    header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    header p { margin: 6px 0 28px; color: var(--muted); }
    .accent { color: var(--accent); }
    form { display: flex; gap: 10px; }
    input[type=text] {
      flex: 1; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 16px; outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    button {
      padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent-2);
      color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .examples { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-size: 13px; color: var(--muted); background: var(--panel);
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .controls label { color: var(--muted); font-size: 13px; }
    .controls input[type=number] { width: 84px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; }
    .controls input[type=number]:focus { border-color: var(--accent); outline: none; }
    .controls select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 14px; }
    .controls select:focus { border-color: var(--accent); outline: none; }
    .controls .hint { color: var(--muted); font-size: 12px; }
    /* Mode/top_k don't apply to forced Graph/SQL routes — dim + disable them. */
    .controls .is-disabled { opacity: 0.4; }
    .controls select:disabled, .controls input:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { margin-top: 28px; color: var(--muted); min-height: 22px; }
    .route-card { margin-top: 22px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px; }
    .route-card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rbadge { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      border-radius: 6px; padding: 3px 9px; }
    .rbadge.local { background: #15331f; color: #7ee2a8; border: 1px solid #2c6b45; }
    .rbadge.api { background: #1c2350; color: #9db0ff; border: 1px solid #3a47a0; }
    .route-card .model { font-weight: 600; }
    .route-card .reason { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .route-card .stats { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .route-card .stats b { color: var(--text); }
    .answer {
      margin-top: 22px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 22px; white-space: pre-wrap;
    }
    .answer.unknown { color: var(--muted); font-style: italic; }
    h2.sub { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 30px 0 12px; }
    .cite {
      background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    }
    .cite .meta { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .cite .meta b { color: var(--text); }
    .cite .snippet { font-size: 14px; color: #c7ccd6; }
    .badge { display: inline-block; min-width: 22px; text-align: center; background: var(--accent-2);
      color: white; border-radius: 6px; font-size: 12px; font-weight: 700; padding: 1px 6px; margin-right: 8px; }
    .error { color: #ff8080; }
    .kb { margin-top: 8px; }
    .source-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; margin-bottom: 8px; }
    .source-row .name { font-weight: 600; }
    .source-row .sub2 { color: var(--muted); font-size: 13px; }
    .del-btn { background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .del-btn:hover { border-color: #ff8080; color: #ff8080; }
    .del-btn:disabled { opacity: 0.5; cursor: default; }
    .kb-empty { color: var(--muted); font-size: 14px; }
    .hist-row { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
    .hist-row:hover { border-color: var(--accent); }
    .hist-row .q { font-weight: 600; }
    .hist-row .meta2 { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .hist-empty { color: var(--muted); font-size: 14px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Source<span class="accent">rer</span></h1>
      <p>Ask a question. Every answer is grounded in your documents — with sources.</p>
    </header>

    <form id="ask-form">
      <input id="q" type="text" placeholder="e.g. What is the support SLA for Enterprise customers?"
             autocomplete="off" autofocus />
      <button id="submit" type="submit">Ask</button>
    </form>
    <div class="examples" id="examples"></div>

    <div class="controls">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="hybrid">Hybrid (vector + BM25)</option>
        <option value="hybrid+rerank">Hybrid + rerank (MiniLM)</option>
        <option value="vector">Vector only</option>
      </select>
      <label for="route">Route</label>
      <select id="route">
        <option value="auto">Auto (router decides)</option>
        <option value="local">Local LLM</option>
        <option value="api">API model</option>
        <option value="graph-local">GraphRAG (local reduce)</option>
        <option value="graph-api">GraphRAG (API reduce)</option>
        <option value="sql">Text-to-SQL (database)</option>
      </select>
      <label for="topk" id="topkLabel">top_k</label>
      <input id="topk" type="number" min="1" max="50" placeholder="5" />
      <span class="hint" id="controlsHint">top_k blank = default (5)</span>
    </div>

    <div id="status"></div>
    <div id="result"></div>

    <h2 class="sub">Recent queries</h2>
    <div id="history" class="kb"></div>

    <h2 class="sub">Knowledge base</h2>
    <div id="sources" class="kb"></div>

    <footer>
      Hybrid retrieval (Phase 2) · hybrid routing local↔API (Phase 4) · <a href="/docs">API docs</a>
    </footer>
  </main>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("q");
    const modeSelect = document.getElementById("mode");
    const routeSelect = document.getElementById("route");
    const topkInput = document.getElementById("topk");
    const submitBtn = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    const EXAMPLES = [
      "Where are Sourcerer's offices located?",
      "Compare incident severity levels and explain why a Sev-1 is handled differently than a Sev-3.",
      "What is the on-call salary stipend?",
      "What were the total sales in 2025?",
      "ยอดขายรวมของปี 2025 เท่าไหร่",
    ];
    const examplesEl = document.getElementById("examples");
    for (const ex of EXAMPLES) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = ex;
      chip.onclick = () => { input.value = ex; input.focus(); };
      examplesEl.appendChild(chip);
    }

    // Some control combinations are meaningless: when a Graph or Text-to-SQL route
    // is forced, the backend takes that path BEFORE reading Mode / top_k (see
    // routes.py), so retrieval Mode and top_k have no effect. Disable them so the
    // UI can't offer an invalid combination (e.g. GraphRAG + Vector mode).
    const modeLabel = document.querySelector('label[for="mode"]');
    const topkLabel = document.getElementById("topkLabel");
    const controlsHint = document.getElementById("controlsHint");
    const RETRIEVAL_ROUTES = new Set(["auto", "local", "api"]);

    function syncControls() {
      const usesRetrieval = RETRIEVAL_ROUTES.has(routeSelect.value);
      for (const [el, label] of [[modeSelect, modeLabel], [topkInput, topkLabel]]) {
        el.disabled = !usesRetrieval;
        label.classList.toggle("is-disabled", !usesRetrieval);
      }
      controlsHint.textContent = usesRetrieval
        ? "top_k blank = default (5)"
        : "Mode & top_k don't apply to this route";
    }
    routeSelect.addEventListener("change", syncControls);
    syncControls();

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    const NO_ANSWER = "I don't know based on the provided documents.";

    function render(data) {
      const isUnknown = data.answer.trim().startsWith(NO_ANSWER);

      // Phase 4 routing trace — show where the query went and why.
      let html = "";
      if (data.route) {
        const routeClass = data.route === "api" ? "api" : "local";
        const cost = data.cost_usd ? `$${data.cost_usd.toFixed(5)}` : "$0 (local)";
        const diff = (data.difficulty ?? 0).toFixed(2);
        html += `
          <div class="route-card">
            <div class="top">
              <span class="rbadge ${routeClass}">${escapeHtml(data.route)}</span>
              <span class="model">${escapeHtml(data.model || "")}</span>
              ${data.retrieval_path && data.retrieval_path !== "hybrid"
                ? `<span class="model">via ${escapeHtml(data.retrieval_path)}</span>` : ""}
            </div>
            <div class="reason">${escapeHtml(data.router_reason || "")}</div>
            <div class="stats">difficulty <b>${diff}</b> · tokens
              <b>${data.input_tokens}/${data.output_tokens}</b> in/out · est. cost <b>${cost}</b></div>
          </div>`;
      }

      html += `<div class="answer${isUnknown ? " unknown" : ""}">${escapeHtml(data.answer)}</div>`;

      if (data.citations && data.citations.length) {
        html += `<h2 class="sub">Sources</h2>`;
        for (const c of data.citations) {
          html += `
            <div class="cite">
              <div class="meta">
                <span class="badge">${c.n}</span>
                <b>${escapeHtml(c.source)}</b> · chunk ${c.chunk_index} · score ${c.score.toFixed(3)}
              </div>
              <div class="snippet">${escapeHtml(c.snippet)}</div>
            </div>`;
        }
      }
      resultEl.innerHTML = html;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      submitBtn.disabled = true;
      statusEl.textContent = "Retrieving and generating…";
      resultEl.innerHTML = "";

      const body = { query };
      // Only send retrieval controls when they actually apply (see syncControls).
      if (!modeSelect.disabled) {
        if (modeSelect.value === "hybrid+rerank") {
          body.mode = "hybrid";
          body.rerank = true;
        } else {
          body.mode = modeSelect.value;
        }
        const topk = parseInt(topkInput.value, 10);
        if (Number.isFinite(topk)) body.top_k = topk;
      }
      if (routeSelect.value !== "auto") body.route_override = routeSelect.value;

      const started = performance.now();
      try {
        const resp = await fetch("/query", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(`HTTP ${resp.status}: ${text}`);
        }
        const data = await resp.json();
        const secs = ((performance.now() - started) / 1000).toFixed(1);
        statusEl.textContent = `Answered in ${secs}s · ${data.retrieval_mode} mode`;
        render(data);
        loadHistory();
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ---- Knowledge base panel ----
    const sourcesEl = document.getElementById("sources");

    async function loadSources() {
      try {
        const resp = await fetch("/sources");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const sources = await resp.json();
        if (!sources.length) {
          sourcesEl.innerHTML =
            `<div class="kb-empty">No sources yet. Add files to data/raw/ and run scripts/ingest.py.</div>`;
          return;
        }
        sourcesEl.innerHTML = "";
        for (const s of sources) {
          const row = document.createElement("div");
          row.className = "source-row";

          const left = document.createElement("div");
          left.innerHTML =
            `<div class="name">${escapeHtml(s.source)}</div>` +
            `<div class="sub2">${s.chunks} chunk${s.chunks === 1 ? "" : "s"}</div>`;

          const btn = document.createElement("button");
          btn.className = "del-btn";
          btn.textContent = "Delete";
          btn.onclick = () => deleteSource(s.source, btn);

          row.append(left, btn);
          sourcesEl.appendChild(row);
        }
      } catch (err) {
        sourcesEl.innerHTML =
          `<div class="kb-empty">Couldn't load sources: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function deleteSource(name, btn) {
      if (!confirm(`Delete "${name}" from the knowledge base? This removes all its chunks.`)) return;
      btn.disabled = true;
      btn.textContent = "Deleting…";
      try {
        const resp = await fetch(`/sources/${encodeURIComponent(name)}`, { method: "DELETE" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        await loadSources();
      } catch (err) {
        alert(`Delete failed: ${err.message}`);
        btn.disabled = false;
        btn.textContent = "Delete";
      }
    }

    // ---- Recent queries panel ----
    const historyEl = document.getElementById("history");

    async function loadHistory() {
      try {
        const resp = await fetch("/history?limit=20");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const items = await resp.json();
        if (!items.length) {
          historyEl.innerHTML = `<div class="hist-empty">No queries yet — ask something above.</div>`;
          return;
        }
        historyEl.innerHTML = "";
        for (const it of items) {
          const row = document.createElement("div");
          row.className = "hist-row";
          const when = new Date(it.created_at).toLocaleString();
          const cites = it.num_citations === 1 ? "1 citation" : `${it.num_citations} citations`;
          const route = it.route ? ` · ${it.route}` : "";
          const cost = it.cost_usd ? ` · $${it.cost_usd.toFixed(4)}` : "";
          row.innerHTML =
            `<div class="q">${escapeHtml(it.query)}</div>` +
            `<div class="meta2">${when} · ${it.latency_ms} ms · ${cites}${route}${cost}</div>`;
          row.title = "Click to reuse this query";
          row.onclick = () => {
            input.value = it.query;
            input.focus();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          historyEl.appendChild(row);
        }
      } catch (err) {
        historyEl.innerHTML =
          `<div class="hist-empty">Couldn't load history: ${escapeHtml(err.message)}</div>`;
      }
    }

    loadHistory();
    loadSources();
  </script>
</body>
</html>
