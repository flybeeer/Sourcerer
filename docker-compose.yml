# One command to run the stack: `docker-compose up`
# Postgres (with pgvector) + Ollama + the FastAPI app.
# Values come from .env (copy from .env.example first).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcerer}
      POSTGRES_USER: ${POSTGRES_USER:-sourcerer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql runs on first init: enables the pgvector extension
      - ./src/sourcerer/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcerer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # After start, pull the models the app needs (embeddings + generation):
    #   docker compose exec ollama ollama pull bge-m3
    #   docker compose exec ollama ollama pull qwen2.5:32b   (or a smaller LOCAL_MODEL)

  # vLLM alternative to Ollama for higher-throughput local serving (Phase 5).
  # Uncomment, point LOCAL_BACKEND=vllm + VLLM_BASE_URL=http://vllm:8000 in .env,
  # and set the model. Needs an NVIDIA GPU + the container toolkit.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: ["--model", "Qwen/Qwen2.5-3B-Instruct", "--port", "8000"]
  #   ports:
  #     - "8001:8000"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  api:
    build: .
    env_file: .env
    environment:
      # override hosts so the app reaches the other containers, not localhost
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
