[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourcerer"
version = "0.1.0"
description = "A hybrid RAG knowledge assistant that answers from your documents — with sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dependencies are intentionally minimal for the scaffold; add per phase.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "psycopg[binary]",
    "pgvector",
    "pypdf",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-asyncio",
]
# Local cross-encoder reranker (bge-reranker). Heavy (pulls torch).
rerank = [
    "sentence-transformers",
]
# Cohere Rerank API backend.
cohere = [
    "cohere",
]
# Frontier API model for the Phase 4 "hard query" route.
api = [
    "anthropic",
]
# GraphRAG (Phase 6) — community detection over the entity graph.
graphrag = [
    "networkx",
]

[project.scripts]
sourcerer-ingest = "scripts.ingest:main"
sourcerer-eval = "scripts.run_eval:main"
sourcerer-route-report = "scripts.route_report:main"
sourcerer-graphrag-index = "scripts.graphrag_index:main"
sourcerer-graphrag-eval = "scripts.graphrag_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcerer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
