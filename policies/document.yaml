# Cerbos resource policy for document assets (Phase 10b).
#
# This mirrors src/sourcerer/governance/policy.py — the written reference policy.
# When GOVERNANCE_PDP=cerbos, the gate asks this PDP instead of evaluating
# policy.can_read in-process; both must yield the same allow/deny.
#
#   ALLOW read if  principal is admin
#              OR  asset.classification in principal.readable_classifications  (lattice)
#              OR  asset.owner_team in principal.teams                         (ownership)
#
# The lattice comparison is precomputed into `readable_classifications` on the
# principal (Principal.readable_classifications = every level ≤ its clearance),
# so the condition is plain set membership instead of rank arithmetic over a map.
# Why: PlanResources can then emit a clean `classification IN [...]` plan that
# governance/plan.py translates to a SQL `= ANY(...)` for predicate pushdown
# (used by CAG). CheckResources and policy.can_read yield the identical set, so
# all three PDP modes stay in parity. Unknown classifications are absent from the
# set → denied (fail-safe), matching catalog.classification_rank.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: document
  rules:
    # Admins read anything.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # Everyone else: clearance lattice OR team ownership (ABAC).
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: >-
            R.attr.classification in P.attr.readable_classifications
            || (has(R.attr.owner_team) && R.attr.owner_team in P.attr.teams)
